services:
  - type: web
    name: grinlife
    runtime: node
    plan: free
    region: oregon
    # npm ci, not npm install: the lockfile is tracked and a deploy must be reproducible.
    # `NODE_ENV=production` is set below for runtime safety, and Render exposes env vars
    # during build too, so `npm ci` must include devDependencies explicitly or Vite / esbuild
    # are omitted and the build fails with `vite: not found`.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    # /api/health answers 200 with JSON and touches no disk, so it is a true liveness probe.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      - key: GRIN_DATA_FILE
        value: /opt/render/project/src/apps/grinlife/data/gate-status.json
      - key: GRIN_INTENT_FILE
        value: /opt/render/project/src/apps/grinlife/data/intent.json
      - key: GRIN_SITE_URL
        sync: false
