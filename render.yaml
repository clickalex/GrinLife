# Render Blueprint — deploy this repo with `New +` → `Blueprint` and point it at the repo.
# https://render.com/docs/blueprint-spec
#
# This app is a Node server, not a static site: it mounts the status API at /api,
# generates /sitemap.xml and /robots.txt, injects each route's <head> server-side, and
# returns a real 404 status on unknown paths. None of that exists on a static host.
#
# The `disk` block is the reason for `plan: starter`. Gate measurements, gate history and
# intent counts are written as JSON files, so they need a filesystem that survives a
# restart. Render's free tier has an ephemeral filesystem — it will appear to work and
# then silently lose every recorded gate decision on the next deploy. To try it on free
# anyway, set `plan: free` and delete the `disk:` block; the site still runs, but nothing
# persists.

services:
  - type: web
    name: grinlife
    runtime: node
    plan: free
    region: oregon
    # npm ci, not npm install: the lockfile is tracked and a deploy must be reproducible.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # /api/health answers 200 with JSON and touches no disk, so it is a true liveness probe.
    healthCheckPath: /api/health
    autoDeploy: true
    #disk:
      #name: grinlife-data
      #mountPath: /var/data
      #sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      # Without this the error handler includes err.message in its response, which leaks
      # server paths. The app checks NODE_ENV explicitly for exactly that reason.
      - key: NODE_ENV
        value: production
      # Both paths must live on the mounted disk, or they are written to the container
      # filesystem and lost on the next deploy.
      - key: GRIN_DATA_FILE
        value: /var/data/gate-status.json
      - key: GRIN_INTENT_FILE
        value: /var/data/intent.json
      # Canonical origin for sitemap.xml, robots.txt, og:url and rel=canonical.
      # Set per environment (e.g. https://grinlife.onrender.com); it is not committed.
      - key: GRIN_SITE_URL
        sync: false
